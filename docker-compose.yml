services:
  mysql:
    image: mysql:8.0
    container_name: hhplus-local-mysql
    ports:
      - "3306:3306"
    environment:
      # Keep local credentials aligned with the Spring local profile.
      MYSQL_DATABASE: hhplus
      MYSQL_USER: application
      MYSQL_PASSWORD: application
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    container_name: hhplus-local-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # Official Apache Kafka image; its default configuration runs a single-node KRaft broker.
    image: apache/kafka:3.9.1
    container_name: hhplus-local-kafka
    ports:
      - "9092:9092"
    # Keep Kafka storage ephemeral for the local verification stack. The official image's
    # default log directory is writable without a named-volume ownership mismatch.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  mysql-data:
  redis-data:
